# Jekyll 설정
title: 구의 기록
email: brightmgu@gmail.com
description: >- # 이 부분은 사이트 설명으로 채워집니다.
baseurl: "" # username.github.io 루트 레포이므로 서브디렉토리 없음
url: "https://brighteen.github.io" # 사용자 블로그 도메인
github_username: brighteen
twitter_username: bright_mgu # If applicable, otherwise remove

# 사이드바 프로필 이미지 설정
# (변경 방법: assets 폴더에 새 이미지를 넣고 파일명을 아래 경로로 변경하시면 즉시 반영됩니다)
profile_image: "/assets/0_me.png"

# 테마 설정
theme: minima

# Collections 설정 (중요)
collections:
  math:
    output: true
    permalink: /math/:path/
  mml:
    output: true
    permalink: /mml/:path/
  note:
    output: true
    permalink: /note/:path/
  genai:
    output: true
    permalink: /genai/:path/
  project:
    output: true
    permalink: /project/:path/

# 빌드 설정
markdown: kramdown
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge
  hard_wrap: true
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# 한글 파일명 처리를 위한 설정
encoding: utf-8

# 빌드 제외 파일
exclude:
  - Gemfile
  - Gemfile.lock
  - docker-compose.yml
  - README.md
  - .agent/
  - tmp/
  - backup_assets/

# 문서별 기본 속성 (Frontmatter) 자동 지정
defaults:
  - scope:
      path: ""
      type: "mml"
    values:
      layout: "sidebar"
      collection_name: "mml"
  - scope:
      path: ""
      type: "math"
    values:
      layout: "sidebar"
      collection_name: "math"
  - scope:
      path: ""
      type: "note"
    values:
      layout: "sidebar"
      collection_name: "note"
  - scope:
      path: ""
      type: "genai"
    values:
      layout: "sidebar"
      collection_name: "genai"
  - scope:
      path: ""
      type: "project"
    values:
      layout: "sidebar"
      collection_name: "project"
