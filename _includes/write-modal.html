<style>
/* =========================================================
   구의 기록 - 마크다운 스튜디오 에디터 스타일 (Self-contained)

<script>
  // 섹션별 카테고리 매핑 (새 컬렉션 명칭 반영: project, mml, note, math, genai)
  const EDITOR_CATEGORIES = {
    project: [
      { name: '프로젝트 루트', folder: '' }
    ],
    mml: [
      { name: 'Part I Mathematical Foundations', folder: 'Part I Mathematical Foundations' },
      { name: 'Part II Central Machine Learning Problems', folder: 'Part II Central Machine Learning Problems' }
    ],
    note: [
      { name: '노트 루트', folder: '' }
    ],
    math: [
      { name: '선형대수', folder: 'linear-algebra' },
      { name: '미적분', folder: 'calculus' },
      { name: '기초', folder: 'basics' },
      { name: '확률과 통계', folder: 'probability-statistics' },
      { name: '머신러닝', folder: 'machine-learning' },
      { name: '정보이론', folder: 'information-theory' }
    ],
    genai: [
      { name: 'Foundations', folder: 'foundations' },
      { name: 'VAE', folder: 'vae' },
      { name: 'Score-Based Model', folder: 'score-based-model' },
      { name: 'Diffusion', folder: 'diffusion' }
    ]
  };

  const GH_OWNER = 'brighteen';
  const GH_REPO = 'brighteen.github.io';
  const GH_BRANCH = 'main';

  let previewRenderTimer = null;

  // 1. 모달 열기/닫기
  function openWriteModal() {
    const backdrop = document.getElementById('write-modal-backdrop');
    if (!backdrop) return;

    checkTokenStatus();
    autoDetectContextForEditor();

    // 에디터가 비어있으면 초기 템플릿 주입
    const editor = document.getElementById('editor-content');
    if (editor && (!editor.value || editor.value.trim() === '')) {
      initEditorContent();
    }

    backdrop.style.display = 'flex';
    requestAnimationFrame(() => {
      backdrop.classList.add('active');
    });
    renderLivePreview();
    setTimeout(() => {
      document.getElementById('post-title')?.focus();
    }, 100);
  }

  function closeWriteModal() {
    const backdrop = document.getElementById('write-modal-backdrop');
    if (backdrop) {
      backdrop.classList.remove('active');
      backdrop.style.display = 'none';
    }
  }

  // 2. 현재 맥락 자동 감지
  function autoDetectContextForEditor() {
    const path = window.location.pathname.toLowerCase();
    const sectionSelect = document.getElementById('post-section');
    if (!sectionSelect) return;

    let targetSection = 'math';
    let targetFolder = '';

    if (path.includes('/project/')) {
      targetSection = 'project';
    } else if (path.includes('/mml/')) {
      targetSection = 'mml';
      if (path.includes('part-ii') || path.includes('part%20ii')) targetFolder = 'Part II Central Machine Learning Problems';
      else targetFolder = 'Part I Mathematical Foundations';
    } else if (path.includes('/note/') || path.includes('/research/')) {
      targetSection = 'note';
    } else if (path.includes('/genai/')) {
      targetSection = 'genai';
      if (path.includes('/vae/')) targetFolder = 'vae';
      else if (path.includes('/diffusion/')) targetFolder = 'diffusion';
      else if (path.includes('/score-based-model/')) targetFolder = 'score-based-model';
      else if (path.includes('/foundations/')) targetFolder = 'foundations';
    } else if (path.includes('/math/') || path.includes('/notes/')) {
      targetSection = 'math';
      if (path.includes('/linear-algebra/')) targetFolder = 'linear-algebra';
      else if (path.includes('/calculus/')) targetFolder = 'calculus';
      else if (path.includes('/basics/')) targetFolder = 'basics';
      else if (path.includes('/probability-statistics/')) targetFolder = 'probability-statistics';
      else if (path.includes('/machine-learning/')) targetFolder = 'machine-learning';
      else if (path.includes('/information-theory/')) targetFolder = 'information-theory';
    }

    sectionSelect.value = targetSection;
    onEditorSectionChange(targetFolder);
  }

  function onEditorSectionChange(defaultFolder) {
    const section = document.getElementById('post-section').value;
    const catSelect = document.getElementById('post-category');
    if (!catSelect) return;

    const cats = EDITOR_CATEGORIES[section] || [];
    if (cats.length <= 1 && cats[0]?.folder === '') {
      catSelect.style.display = 'none';
      catSelect.innerHTML = '<option value="">(루트 폴더)</option>';
    } else {
      catSelect.style.display = 'inline-block';
      catSelect.innerHTML = cats.map(c => `<option value="${c.folder}">${c.name}</option>`).join('');
      if (defaultFolder) catSelect.value = defaultFolder;
    }

    updateEditorTargetPath();
    updateEditorFrontmatter();
  }

  function onEditorTitleInput() {
    updateEditorTargetPath();
    updateEditorFrontmatter();
  }

  function updateEditorTargetPath() {
    const section = document.getElementById('post-section')?.value || 'math';
    const category = document.getElementById('post-category')?.value || '';
    const rawTitle = document.getElementById('post-title')?.value.trim() || '새글';
    const safeTitle = rawTitle.replace(/[\\/:*?"<>|]/g, '-').trim();
    const filename = `${safeTitle}.md`;

    const baseDir = `_${section}`;
    const targetDir = category ? `${baseDir}/${category}` : baseDir;
    const fullPath = `${targetDir}/${filename}`;

    const label = document.getElementById('status-target-path');
    if (label) label.innerHTML = `저장 경로: <code>${fullPath}</code>`;
  }

  // 3. 에디터 템플릿 및 자동 Frontmatter 조립
  function initEditorContent() {
    // 사용자가 순수 본문만 쾌적하게 쓸 수 있도록 텍스트창에는 프론트매터를 노출하지 않음
    document.getElementById('editor-content').value = '';
    renderLivePreview();
  }

  function updateEditorFrontmatter() {
    // 툴바의 제목/섹션 변경 시 프리뷰만 갱신
    renderLivePreview();
  }

  // 발행, 저장, 복사 시 백그라운드에서 Frontmatter를 자동 조립하여 완성본 반환
  function getFullPostContent() {
    const title = document.getElementById('post-title')?.value.trim() || '제목 없는 글';
    const section = document.getElementById('post-section')?.value || 'math';
    const today = new Date().toISOString().split('T')[0];
    const body = document.getElementById('editor-content')?.value || '';

    // 만약 사용자가 수동으로 Frontmatter를 적었다면 중복 방지
    if (body.trim().startsWith('---')) {
      return body;
    }

    return `---
layout: sidebar
title: ${title}
collection_name: ${section}
date: ${today}
---

${body}`;
  }

  function onEditorContentChange() {
    const text = document.getElementById('editor-content')?.value || '';
    document.getElementById('status-word-count').innerText = `${text.length}자`;

    clearTimeout(previewRenderTimer);
    previewRenderTimer = setTimeout(() => {
      renderLivePreview();
    }, 250);
  }

  // 4. 경량 마크다운 + MathJax 실시간 렌더링
  function renderLivePreview() {
    const preview = document.getElementById('editor-preview');
    const editor = document.getElementById('editor-content');
    if (!preview || !editor) return;

    let content = editor.value;

    // 수동 작성된 Frontmatter가 있다면 미리보기에서만 숨김
    if (content.startsWith('---')) {
      const endIdx = content.indexOf('---', 3);
      if (endIdx !== -1) {
        content = content.substring(endIdx + 3).trim();
      }
    }

    // 간단한 마크다운 파싱 (HTML Escape 방지하며 수식 보존)
    let parsed = content
      // 헤딩
      .replace(/^#### (.*$)/gim, '<h4>$1</h4>')
      .replace(/^### (.*$)/gim, '<h3>$1</h3>')
      .replace(/^## (.*$)/gim, '<h2>$1</h2>')
      .replace(/^# (.*$)/gim, '<h1>$1</h1>')
      // 볼드, 이탤릭
      .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/gim, '<em>$1</em>')
      // 인용구
      .replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>')
      // 리스트
      .replace(/^\- (.*$)/gim, '<li>$1</li>')
      // 코드블록
      .replace(/```([\s\S]*?)```/gim, '<pre><code>$1</code></pre>')
      .replace(/`([^`]+)`/gim, '<code>$1</code>')
      // 줄바꿈
      .replace(/\n\n+/gim, '<br><br>');

    preview.innerHTML = parsed || '<p style="color:#aaa;">미리보기가 여기에 표시됩니다.</p>';

    // MathJax 3 실시간 타입셋
    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetPromise([preview]).catch(err => console.log('MathJax typeset error:', err));
    }
  }

  // 5. 뷰 모드 전환 (분할 / 편집 / 미리보기)
  function setEditorView(mode) {
    const workspace = document.getElementById('editor-workspace');
    const btnSplit = document.getElementById('btn-view-split');
    const btnEdit = document.getElementById('btn-view-edit');
    const btnPreview = document.getElementById('btn-view-preview');

    [btnSplit, btnEdit, btnPreview].forEach(b => b?.classList.remove('active'));
    workspace.classList.remove('view-edit-only', 'view-preview-only');

    if (mode === 'edit-only') {
      workspace.classList.add('view-edit-only');
      btnEdit.classList.add('active');
    } else if (mode === 'preview-only') {
      workspace.classList.add('view-preview-only');
      btnPreview.classList.add('active');
      renderLivePreview();
    } else {
      btnSplit.classList.add('active');
      renderLivePreview();
    }
  }

  function handleEditorTab(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const textarea = e.target;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      textarea.value = textarea.value.substring(0, start) + '  ' + textarea.value.substring(end);
      textarea.selectionStart = textarea.selectionEnd = start + 2;
    }
  }

  // 6. 파일 다운로드 (.md)
  function downloadMarkdownFile() {
    const fullContent = getFullPostContent();
    const rawTitle = document.getElementById('post-title')?.value.trim() || '새글';
    const filename = `${rawTitle.replace(/[\\/:*?"<>|]/g, '-').trim()}.md`;

    const blob = new Blob([fullContent], { type: 'text/markdown;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  // 7. 클립보드 복사
  function copyMarkdownContent() {
    const fullContent = getFullPostContent();
    navigator.clipboard.writeText(fullContent).then(() => {
      alert('Frontmatter를 포함한 전체 마크다운 내용이 클립보드에 복사되었습니다!');
    }).catch(() => {
      alert('복사에 실패했습니다. 직접 복사해 주세요.');
    });
  }

  // 8. GitHub API 직접 발행 (원클릭 백그라운드 푸시)
  async function publishPostDirectly() {
    const token = localStorage.getItem('gh_pat_token');
    const section = document.getElementById('post-section').value;
    const category = document.getElementById('post-category').value;
    const rawTitle = document.getElementById('post-title').value.trim();
    const userCommitMsg = document.getElementById('post-commit-msg').value.trim();
    const fullContent = getFullPostContent();

    if (!rawTitle) {
      alert('글 제목을 입력해 주세요.');
      document.getElementById('post-title').focus();
      return;
    }

    const safeTitle = rawTitle.replace(/[\\/:*?"<>|]/g, '-').trim();
    const filename = `${safeTitle}.md`;
    const baseDir = `_${section}`;
    const targetDir = category ? `${baseDir}/${category}` : baseDir;
    const targetPath = `${targetDir}/${filename}`;
    const commitMsg = userCommitMsg || `docs: add new post ${rawTitle}`;

    // 토큰이 없는 경우: 토큰 등록 팝업 띄우기 or GitHub Web Editor 열기 옵션 제공
    if (!token) {
      const choice = confirm(
        '블로그 내에서 1초 만에 바로 배포하려면 GitHub 토큰(PAT) 연동이 필요합니다.\n\n' +
        '• [확인]: GitHub 토큰을 등록하고 바로 배포하기\n' +
        '• [취소]: 토큰 없이 깃허브 웹사이트 에디터로 열기'
      );
      if (choice) {
        promptTokenSetting();
      } else {
        // 기존 깃허브 웹 에디터 링크 열기
        const githubUrl = `https://github.com/${GH_OWNER}/${GH_REPO}/new/${GH_BRANCH}/${targetDir}?filename=${encodeURIComponent(filename)}&value=${encodeURIComponent(fullContent)}&message=${encodeURIComponent(commitMsg)}`;
        window.open(githubUrl, '_blank');
      }
      return;
    }

    // 토큰이 있을 때: GitHub REST API로 원클릭 커밋 & 푸시
    const publishBtn = document.getElementById('btn-publish-main');
    const originalText = publishBtn.innerHTML;
    publishBtn.disabled = true;
    publishBtn.innerText = '발행 중...';

    try {
      // 1. 기존 파일의 SHA 조회 (덮어쓰기/수정 대응)
      let sha = null;
      try {
        const getRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${encodeURIComponent(targetPath)}`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        if (getRes.ok) {
          const fileData = await getRes.json();
          sha = fileData.sha;
        }
      } catch (err) {
        // 파일이 없으면 정상 진행
      }

      // 2. PUT 파일 생성/업데이트
      const putBody = {
        message: commitMsg,
        content: btoa(unescape(encodeURIComponent(fullContent))), // UTF-8 Base64 인코딩
        branch: GH_BRANCH
      };
      if (sha) putBody.sha = sha;

      const putRes = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${encodeURIComponent(targetPath)}`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(putBody)
      });

      if (putRes.ok) {
        alert(`🎉 발행 완료!\n\n파일이 저장소에 성공적으로 커밋되었습니다.\n(${targetPath})\nGitHub Actions가 약 1분 내에 사이트에 자동 반영합니다.`);
        closeWriteModal();
      } else {
        const errJson = await putRes.json();
        let errMsg = errJson.message || '토큰 권한을 확인해 주세요.';
        if (errMsg.includes('Resource not accessible')) {
          errMsg = '토큰 권한 부족 (저장소 쓰기 권한이 없습니다)\n\n• Classic 토큰(ghp_)인 경우: [repo] 전체 체크 필요\n• Fine-grained 토큰(github_pat_)인 경우:\n  1) Repository access에서 [brighteen.github.io] 선택\n  2) Repository permissions에서 [Contents] 권한을 [Read and write]로 설정 필요';
        }
        alert(`발행 실패: ${errMsg}`);
      }
    } catch (error) {
      alert(`네트워크 오류가 발생했습니다: ${error.message}`);
    } finally {
      publishBtn.disabled = false;
      publishBtn.innerHTML = originalText;
    }
  }

  // 9. 토큰 관리 다이얼로그
  function promptTokenSetting() {
    const dialog = document.getElementById('token-dialog-backdrop');
    const input = document.getElementById('input-pat-token');
    const existing = localStorage.getItem('gh_pat_token') || '';
    if (input) input.value = existing;
    if (dialog) dialog.style.display = 'flex';
  }

  function closeTokenDialog() {
    const dialog = document.getElementById('token-dialog-backdrop');
    if (dialog) dialog.style.display = 'none';
  }

  function saveGitHubToken() {
    const input = document.getElementById('input-pat-token');
    const token = input ? input.value.trim() : '';
    if (token) {
      localStorage.setItem('gh_pat_token', token);
      alert('GitHub 토큰이 브라우저에 저장되었습니다! 이제 블로그 내에서 [발행하기]를 바로 사용하실 수 있습니다.');
    } else {
      localStorage.removeItem('gh_pat_token');
      alert('GitHub 토큰이 삭제되었습니다.');
    }
    checkTokenStatus();
    closeTokenDialog();
  }

  function checkTokenStatus() {
    const token = localStorage.getItem('gh_pat_token');
    const indicator = document.getElementById('editor-status-indicator');
    const btnLabel = document.getElementById('btn-token-label');
    const writeBtn = document.getElementById('btn-write-header');

    // 관리자(소유자) 여부 판단: 로컬 환경이거나, 저장된 토큰이 있거나, ?admin 파라미터가 있는 경우
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const hasToken = !!token;
    const urlParams = new URLSearchParams(window.location.search);
    const isAdminParam = urlParams.has('admin') || urlParams.has('write');

    if (writeBtn) {
      writeBtn.style.display = 'inline-flex';
    }

    if (token) {
      if (indicator) {
        indicator.innerText = '원클릭 발행 모드';
        indicator.style.background = '#dafbe1';
        indicator.style.color = '#1a7f37';
      }
      if (btnLabel) btnLabel.innerText = '연동됨 ✓';
    } else {
      if (indicator) {
        indicator.innerText = '로컬 모드';
        indicator.style.background = '#eef2f6';
        indicator.style.color = '#555';
      }
      if (btnLabel) btnLabel.innerText = 'GitHub 연동';
    }
  }

  // 10. 초기 리스너 등록
  document.addEventListener('DOMContentLoaded', function() {
    const backdrop = document.getElementById('write-modal-backdrop');
    const closeBtn = document.getElementById('modal-close-btn');

    if (closeBtn) closeBtn.addEventListener('click', closeWriteModal);
    
    // 단축키 리스너
    document.addEventListener('keydown', function(e) {
      // 1. ESC 키로 닫기
      if (e.key === 'Escape') {
        const tokenDialog = document.getElementById('token-dialog-backdrop');
        if (tokenDialog && tokenDialog.style.display === 'flex') {
          closeTokenDialog();
        } else if (backdrop && backdrop.classList.contains('active')) {
          closeWriteModal();
        }
      }
      // 2. 어디서든 Ctrl + Shift + W (또는 Mac Cmd + Shift + W) 누르면 글쓰기 에디터 즉시 호출
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'W' || e.key === 'w')) {
        e.preventDefault();
        openWriteModal();
      }
    });

    onEditorSectionChange();
    checkTokenStatus();

    // URL에 ?admin 또는 ?write가 있으면 자동으로 에디터 오픈
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('admin') || urlParams.has('write')) {
      openWriteModal();
    }
  });
</script>
